name: Build Flutter APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # إنشاء تطبيق فلاتر نظيف بالكامل من الصفر لتفادي أي أخطاء في pubspec أو android
      - name: Re-create Clean Flutter App
        run: |
          mkdir temp_app
          cd temp_app
          flutter create imposter_alive --org com.imposter.alive
          cp -r imposter_alive/* ../
          cd ..
          rm -rf temp_app

      # إعادة استبدال ملف main.dart بكود اللعبة الخاص بك
      - name: Ensure Main Game Code
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Imposter-Alive-APK
          path: build/app/outputs/flutter-apk/app-release.apk
