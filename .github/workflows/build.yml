name: Build Flutter APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. جلب كود المشروع
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. إعداد Java 17
      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. إعداد Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 4. إعادة إنشاء إعدادات منصة الأندرويد تلقائياً لتجنب أي ملفات مفقودة
      - name: Re-create Android platform files
        run: flutter create . --platforms=android --org=com.imposter.alive

      # 5. تحميل المكتبات والـ Dependencies
      - name: Install dependencies
        run: flutter pub get

      # 6. بناء ملف الـ APK
      - name: Build APK
        run: flutter build apk --release

      # 7. رفع الـ APK المكتمل كـ Artifact للتحميل
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Imposter-Alive-APK
          path: build/app/outputs/flutter-apk/app-release.apk
